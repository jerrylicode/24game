<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 46" width="122" height="46" role="img" aria-label="24Game">
  <!-- 24Game 品牌砖：一块竖着切的糖砖——左半薄荷写 24，右半琥珀写 Game（和「关卡」主按钮同色），
       底下一层同色的深色厚边 + 顶部白色高光，和按钮同一套“可以按下去”的手感。
       纯矢量、无外链字体、可离线。 -->
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#b6ffe6"/>
      <stop offset=".45" stop-color="#7defc9"/>
      <stop offset="1" stop-color="#17c99a"/>
    </linearGradient>
    <!-- 右半和坞里的「关卡」主按钮同色：琥珀糖砖 -->
    <linearGradient id="warm" x1="0.15" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffeab6"/>
      <stop offset=".36" stop-color="#ffdd93"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <linearGradient id="mintEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b8f6d"/>
      <stop offset="1" stop-color="#086b51"/>
    </linearGradient>
    <linearGradient id="warmEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a10"/>
      <stop offset="1" stop-color="#a8740c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="brick"><rect x="5" y="4" width="112" height="34" rx="11"/></clipPath>
  </defs>

  <g transform="rotate(-3 61 23)">
    <!-- 1. 厚底边：整块阴影砖，往下错 4px（左半深薄荷、右半深珊瑚） -->
    <rect x="5" y="8" width="56" height="34" rx="11" fill="url(#mintEdge)"/>
    <rect x="57" y="8" width="60" height="34" rx="11" fill="url(#warmEdge)"/>

    <!-- 2. 砖面：同样左右两块拼成一块，接缝在 x=57 -->
    <rect x="5" y="4" width="56" height="34" rx="11" fill="url(#mint)"/>
    <rect x="57" y="4" width="60" height="34" rx="11" fill="url(#warm)"/>

    <!-- 3. 顶部高光（裁进砖形里，不越出圆角） -->
    <g clip-path="url(#brick)">
      <rect x="5" y="4" width="112" height="15" fill="url(#sheen)" opacity=".85"/>
    </g>

    <!-- 4. 砖上的字：深墨色，两块底上都压得住 -->
    <text x="33" y="28.6" text-anchor="middle" textLength="26" lengthAdjust="spacingAndGlyphs"
          font-family="ui-rounded, 'SF Pro Rounded', 'Hiragino Maru Gothic ProN', 'Nunito', 'PingFang SC', system-ui, sans-serif"
          font-size="21" font-weight="900" letter-spacing="-0.6" fill="#0b2a21">24</text>
    <text x="87" y="28" text-anchor="middle" textLength="51" lengthAdjust="spacingAndGlyphs"
          font-family="ui-rounded, 'SF Pro Rounded', 'Hiragino Maru Gothic ProN', 'Nunito', 'PingFang SC', system-ui, sans-serif"
          font-size="19.5" font-weight="900" letter-spacing="-0.4" fill="#0b2a21">Game</text>
  </g>
</svg>
